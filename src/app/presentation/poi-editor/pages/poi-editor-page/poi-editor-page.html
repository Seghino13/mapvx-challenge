<div class="poi-editor">
  <aside class="poi-editor__sidebar">
    Sidebar
  </aside>

  <section class="poi-editor__map">
    Map
  </section>

  <aside class="poi-editor__panel">
    <h3>POIs</h3>

    <ul>
      @for (poi of pois(); track poi.id) {
        <li>{{ poi.name }} ({{ poi.category }})</li>
      }
    </ul>
  </aside>
</div>
